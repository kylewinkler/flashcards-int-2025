type User {
    id: ID!
    firstName: String!
    lastName: String!
    email: String!
}

type Query {
    getUsers: [User!]!
}

input CreateUserInput {
    firstName: String!
    lastName: String!
    email: String!
    password: String!
}

input LoginInput {
    email: String!
    password: String!
}

type Mutation {
    createUser(createUserInput: CreateUserInput!): String!
    login(loginInput: LoginInput!): String!
}