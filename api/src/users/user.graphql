type User {
    id: ID!
    firstName: String!
    lastName: String!
    email: String!
}

input CreateUserInput {
    firstName: String!
    lastName: String!
    email: String!
    password: String!
}

input LoginInput {
    email: String!
    password: String!
}

type AuthResponse {
  token: String
  error: String
}

type Query {
    getUsers: [User!]!
}

type Mutation {
  createUser(createUserInput: CreateUserInput!): String!
  login(loginInput: LoginInput!): AuthResponse!
}